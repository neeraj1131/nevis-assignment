name: CI

# M9 (deferred): no explicit `permissions:`/`concurrency:` blocks yet — the
# default GITHUB_TOKEN scope and lack of run-cancellation are accepted
# trade-offs for now, not an oversight.
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        # Must run before Typecheck/Test: apps/api and apps/web both resolve
        # @nevis/shared through its compiled dist/ output (its package.json
        # "main"/"exports" point there), and dist/ is gitignored — `pnpm
        # install`'s `prepare` step in packages/shared covers a fresh clone,
        # but running the full build here too keeps this job self-contained
        # even if that ever changes.
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @nevis/shared
        # apps/api and apps/web both import @nevis/shared's compiled dist/
        # output (its package.json "main" points there); playwright.config.ts
        # boots both apps in dev mode (tsx watch / vite), which resolves
        # workspace deps the same way a prod build would.
        run: pnpm --filter @nevis/shared build

      - name: Install Playwright's chromium browser
        run: pnpm --filter @nevis/web exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: nevis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: nevis-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
