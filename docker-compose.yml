services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:8080
    # M12 (deferred): the api port is published to the host, not just
    # reachable on the compose network — convenient for hitting :3000/docs
    # directly in this local/demo setup, but a prod deployment would drop
    # this and route everything through nginx (:8080) only.
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
